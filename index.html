    let [, sName, offer, fit, price, b2c] = seg;
    if(hasSite && b2c && price){ offer = 'AI-агент для заявок с сайта и мессенджеров'; price = 3e6; }
    let score = fit*20 + ({ok:25, unk:10, none:0})[lpr] + (({'Крупный':15, 'Средний':12, 'Малый':6})[size] || 0);
    score += (/^A/.test(prio) ? 8 : /^B/.test(prio) ? 4 : 0) + (phone ? 5 : 0) + (warm.length ? 5 : 0) + (!hasSite && b2c ? 8 : 0) - (ru ? 15 : 0);
    if(!phone) score = Math.min(score, 84); // без телефона — не горячий
    const why = [lpr==='ok' ? 'ЛПР подтверждён' : lpr==='unk' ? 'ЛПР есть, не подтверждён' : 'ЛПР нужно найти',
      hasSite ? 'сайт есть — продаём агента' : 'сайта в базе нет', size && size.toLowerCase() + ' бизнес', prio && 'приоритет ' + prio + ' в базе',
      warm.length && 'уже был контакт по другому продукту', b2c && 'клиенты приходят сами — важна скорость ответа',
      ru && 'Россия — оплата и договор сложнее', !phone && 'телефона нет'].filter(Boolean).join('; ');
    cand.push({co, ls, best, lpr, ru, size, prio, phone, site, hasSite, warm, sName, offer, price:ru ? 0 : price, score, why});
  });
  cand.sort((a, b) => b.score - a.score);
  let sort = -cand.length;
  cand.forEach(c => {
    const tier = c.score >= 85 ? '🔥 Горячий' : c.score >= 65 ? 'Тёплый' : 'Холодный';
    const src = [...new Set(c.ls.map(l => S.pipelines.find(x => x.id===l.pipelineId).name))].join(', ');
    const l = {id:uid(), num:++S.seq, key:'x:' + c.co.id, name:c.offer, price:c.price, pipelineId:p.id, stageId:p.stages[0].id, status:'active',
      lpr:c.lpr, call:'Не звонили', contactId:c.best.contactId || null, companyId:c.co.id, responsible:S.me,
      tags:[tier, c.sName, c.ru ? 'РФ' : ''].filter(Boolean), createdAt:now, updatedAt:now, sort:sort++,
      fields:[['Сегмент',c.sName],['Что продаём',c.offer],['Почему подходит',c.why],['Оценка для Pulse',c.score + ' из 126'],['Сайт',c.hasSite ? c.site : 'нет в базе — проверить перед звонком'],
        ['Размер',c.size],['Телефон',c.phone],['Контакт по другим продуктам',c.warm.join('; ')],['Найден в базе',src],['Рынок',c.ru ? 'Россия' : 'Узбекистан']].filter(f => f[1]),
      feed:[{id:uid(), type:'event', text:`Подобран для Pulse из базы «${src}»`, at:now, author:S.me}]};
    S.leads.push(l); st.added++; st.seg[c.sName] = (st.seg[c.sName]||0) + 1; st.tier[tier] = (st.tier[tier]||0) + 1; st.lpr[c.lpr]++;
  });
  S.px1 = true; save(); return st;
}
function pulseReport(st){
  const segs = Object.entries(st.seg).sort((a,b) => b[1]-a[1]);
  modal('Лиды для Pulse из других баз', st.added ? `<div class="imp-stat"><span>Добавлено <b>${st.added}</b></span>${Object.entries(st.tier).map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('')}</div>
    <div class="imp-stat"><span class="lpr ok">ЛПР ✓ ${st.lpr.ok}</span><span class="lpr unk">ЛПР ? ${st.lpr.unk}</span><span class="lpr none">нет ЛПР ${st.lpr.none}</span><span class="dim">Не подошли по отрасли: ${st.skip}</span></div>
    <div class="mdl-sub">По сегментам</div>${segs.map(([k,v])=>`<div class="rel"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}`
    : '<p>Новых подходящих компаний нет — всё уже в воронке Pulse.</p>', {});
}

function parseSheetUrl(u){ const id = (u.match(/\/d\/([\w-]{20,})/)||[])[1], gid = (u.match(/gid=(\d+)/)||[])[1] || '0'; return id ? {id, gid} : null; }

function importModal(){
  let wb = null, fileName = '';
  const m = modal('Импорт базы лидов', `
    <div class="fm"><label>Файл базы (.xlsx, .xls, .csv)</label><input type="file" id="im-file" accept=".xlsx,.xls,.csv" style="padding-top:6px"></div>
    <div class="fm2"><div class="fm"><label>Продукт (куда раскладываем)</label><select id="im-prod">${Object.entries(PRODUCTS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></div>
    <div class="fm"><label>Лист</label><select id="im-sheet" disabled></select></div></div>
    <div id="im-body" class="dim" style="font-size:13px">Выберите файл. Данные читаются прямо в браузере и никуда не отправляются.</div>`,
  {wide:true, okText:'Импортировать', onOk:m => {
    if(!m._ready) { toast('Сначала выберите файл'); return false; }
    const map = {}; $$('[data-mk]', m).forEach(s => map[s.dataset.mk] = +s.value);
    if(map.company < 0){ toast('Укажите колонку с названием компании'); return false; }
    const {st, p} = doImport({rows:m._rows, hdr:m._hdr, map, product:$('#im-prod',m).value, label:`${fileName} · ${$('#im-sheet',m).value}`, perDay:+$('#im-day',m).value||0});
    ui.pipelineId = p.id; ui.preset = 'active'; saveUi(); location.hash = 'leads'; render();
    modal('Импорт завершён', `<div class="imp-stat"><span>Добавлено <b>${st.added}</b></span><span>Дубли пропущены <b>${st.dup}</b></span><span>Без названия <b>${st.empty}</b></span></div>
      <div class="imp-stat"><span class="lpr ok">ЛПР подтверждён: ${st.ok}</span><span class="lpr unk">ЛПР не подтверждён: ${st.unk}</span><span class="lpr none">Нет ЛПР: ${st.none}</span></div>
      <p style="margin:10px 0 0;color:var(--muted);font-size:13px">Уже звонили: ${st.called}. Воронка: «${esc(p.name)}». Фильтры ЛПР и «Звонили / не звонили» — в строке поиска.</p>`, {});
  }});
  const draw = () => {
    const ws = wb.Sheets[$('#im-sheet',m).value];
    const all = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    const hi = headerRow(all), hdr = (all[hi]||[]).map(sv);
    const rows = all.slice(hi+1).map((r,i) => Object.assign(r, {__row:hi+2+i})).filter(r => r.some(x => sv(x)));
    const gm = guessMap(hdr); m._rows = rows; m._hdr = hdr; m._ready = true;
    const opts = sel => `<option value="-1">— нет —</option>` + hdr.map((h,j)=>`<option value="${j}" ${j===sel?'selected':''}>${esc(h || 'Колонка '+(j+1))}</option>`).join('');
    $('#im-body',m).className = '';
    $('#im-body',m).innerHTML = `<div class="mdl-sub" style="margin-top:4px">Колонки (подобраны автоматически — проверьте)</div>
      <div class="imp-map">${IMPF.map(([k,lab])=>`<div class="fm"><label>${lab}</label><select data-mk="${k}">${opts(gm[k])}</select></div>`).join('')}</div>
      <div class="fm" style="margin-top:8px"><label>Поставить задачи «Звонок» новым лидам: сколько в день (0 — не ставить)</label><input id="im-day" type="number" min="0" max="60" value="0"></div>
      <div id="im-prev"></div>`;
    const prev = () => { const map = {}; $$('[data-mk]', m).forEach(s => map[s.dataset.mk] = +s.value);
      const c = {ok:0, unk:0, none:0, called:0, n:0};
      rows.forEach(r => { const g = k => map[k] >= 0 ? sv(r[map[k]]) : ''; if(!g('company')) return; c.n++; c[lprStatus(g('lpr'), g('check'))]++; if(callStage(g('call'))) c.called++; });
      $('#im-prev',m).innerHTML = `<div class="imp-stat"><span>Строк с компанией <b>${c.n}</b></span><span class="lpr ok">ЛПР подтверждён: ${c.ok}</span><span class="lpr unk">не подтверждён: ${c.unk}</span><span class="lpr none">нет ЛПР: ${c.none}</span><span>Звонили: <b>${c.called}</b></span></div>`; };
    $$('[data-mk]', m).forEach(s => s.onchange = prev); prev();
  };
  $('#im-file',m).onchange = async e => {
    const f = e.target.files[0]; if(!f) return; fileName = f.name.replace(/\.[^.]+$/,'');
    $('#im-body',m).textContent = 'Читаю файл…';
    try{ await loadXLSX(); wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      const sh = $('#im-sheet',m); sh.innerHTML = wb.SheetNames.map(n=>`<option>${esc(n)}</option>`).join(''); sh.disabled = false; sh.onchange = draw; draw();
    }catch(err){ $('#im-body',m).textContent = 'Ошибка: ' + err.message; }
  };
}

/* ================= settings ================= */
function renderSettings(){
  main.innerHTML = `
  <div class="topbar"><span class="top-title">Настройки</span></div>
  <div class="page" style="max-width:820px">
    <div class="panel"><h3>Оформление</h3>
      <div class="set-row"><span style="flex:1">Тема</span><div class="seg">${Object.entries({light:'Светлая',dark:'Тёмная',auto:'Авто'}).map(([k,v])=>`<button data-th="${k}" class="${ui.theme===k?'on':''}">${v}</button>`).join('')}</div></div>
    </div>
    <div class="panel"><h3>Базы из Google Таблиц</h3>
      ${(S.sheets || DEFAULT_SHEETS).map((s,i)=>`<div class="set-row"><span style="flex:1"><b>${esc(s.title)}</b> <span class="dim">→ ${esc(PRODUCTS[s.product].name)}</span><br>
        <span style="font-size:12px;color:${s.last&&!s.last.ok?'var(--red)':'var(--muted)'}">${s.last ? (s.last.ok ? `синхронизировано ${fdate(s.last.at)}: ${s.last.total} строк` : '⚠ ' + esc(s.last.err)) : 'ещё не загружалась'}</span></span>
        <a href="https://docs.google.com/spreadsheets/d/${s.id}/edit#gid=${s.gid}" target="_blank" rel="noopener">открыть</a>${S.sheets?`<span class="rm" data-shd="${i}" title="Убрать из синхронизации" style="font-size:18px">×</span>`:''}</div>`).join('')}
      <div class="set-row"><input id="shUrl" placeholder="Ссылка на лист Google Таблицы" style="flex:2"><select id="shProd">${Object.entries(PRODUCTS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><button class="btn btn-sm" id="shAdd">Добавить</button></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-blue" id="shSync">Синхронизировать сейчас</button><span class="dim" style="font-size:12.5px">Новые строки добавятся, статусы звонков и ЛПР обновятся. Ручные правки в CRM не затираются.</span></div>
    </div>
    <div class="panel"><h3>Воронки</h3>
      ${S.pipelines.map(p=>`<div class="set-row"><b style="flex:1">${esc(p.name)}</b><span style="color:var(--muted);font-size:13px">${p.stages.length} ${plural(p.stages.length,['этап','этапа','этапов'])} · ${nLeads(S.leads.filter(l=>l.pipelineId===p.id).length)}</span><button class="btn btn-sm" data-pe="${p.id}">Настроить</button></div>`).join('')}
      <div style="margin-top:10px"><button class="btn btn-sm btn-blue" id="addPipe">+ Добавить воронку</button></div>
    </div>
    <div class="panel"><h3>Пользователи</h3>
      ${S.users.map((u,i)=>`<div class="set-row"><span style="flex:1">${esc(u)} ${u===S.me?'<span style="color:var(--muted);font-size:12px">(это вы)</span>':''}</span>${u!==S.me?`<a href="javascript:void 0" data-me="${i}">сделать «я»</a>`:''}${S.users.length>1?`<span class="rm" data-ud="${i}" style="font-size:18px">×</span>`:''}</div>`).join('')}
      <div class="set-row"><input id="newUser" placeholder="Имя нового пользователя" style="flex:1"><button class="btn btn-sm" id="addUser">Добавить</button></div>
    </div>
    <div class="panel"><h3>Общие</h3>
      <div class="set-row"><span style="flex:1">Название аккаунта (на рабочем столе)</span><input id="accName" value="${esc(S.account||'pulsedigital')}"></div>
      <div class="set-row"><span style="flex:1">Валюта</span><select id="cur">${['€','$','£',"so'm",'сум','₽','₸'].map(c=>`<option ${c===S.currency?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="panel"><h3>Данные</h3>
      <p style="margin:0 0 12px;color:var(--muted2);font-size:13px">Данные хранятся только в этом браузере. Делайте резервную копию, чтобы перенести CRM на другой компьютер.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-blue" id="impBase">Импорт базы лидов (Excel / CSV)</button>
        <button class="btn btn-sm" id="exp">Скачать резервную копию (JSON)</button>
        <label class="btn btn-sm" style="cursor:pointer">Загрузить копию<input type="file" id="imp" accept=".json,application/json" hidden></label>
        <button class="btn btn-sm" id="demo">Загрузить демо-данные</button>
        <button class="btn btn-sm" id="wipe" style="color:var(--red)">Очистить всё</button>
      </div>
    </div>
  </div>`;
  $$('[data-th]').forEach(b => b.onclick = () => setTheme(b.dataset.th));
  $$('[data-pe]').forEach(b => b.onclick = () => editPipeline(b.dataset.pe));
  $('#addPipe').onclick = () => editPipeline(null);
  $('#addUser').onclick = () => { const v=$('#newUser').value.trim(); if(v && !S.users.includes(v)){ S.users.push(v); save(); renderSettings(); } };
  $$('[data-ud]').forEach(b => b.onclick = () => { const u=S.users[+b.dataset.ud]; S.users.splice(+b.dataset.ud,1); if(S.me===u) S.me=S.users[0]; S.leads.forEach(l=>{ if(l.responsible===u) l.responsible=S.me; }); S.tasks.forEach(t=>{ if(t.responsible===u) t.responsible=S.me; }); save(); renderSettings(); });
  $$('[data-me]').forEach(b => b.onclick = () => { S.me = S.users[+b.dataset.me]; save(); renderSettings(); });
  $('#cur').onchange = e => { S.currency = e.target.value; save(); toast('Валюта сохранена'); };
  $('#accName').onchange = e => { S.account = e.target.value.trim() || 'pulsedigital'; save(); toast('Сохранено'); };
  $('#impBase').onclick = importModal;
  $('#shSync').onclick = () => syncSheets(false);
  $('#shAdd').onclick = () => { const u = parseSheetUrl($('#shUrl').value); if(!u) return toast('Не похоже на ссылку Google Таблицы');
    S.sheets = S.sheets || DEFAULT_SHEETS.map(x => ({...x})); S.sheets.push({...u, title:'Таблица ' + (S.sheets.length+1) + ' · лист ' + u.gid, product:$('#shProd').value}); save(); renderSettings(); };
  $$('[data-shd]').forEach(b => b.onclick = () => { S.sheets.splice(+b.dataset.shd, 1); save(); renderSettings(); });
  $('#exp').onclick = () => download(`pulse-crm_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2), 'application/json');
  $('#imp').onchange = e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.pipelines||!d.leads) throw 0; S=d; save(); toast('Копия загружена'); render(); }catch(err){ toast('Не удалось прочитать файл'); } }; r.readAsText(f); };
  $('#demo').onclick = () => confirmBox('Заменить все текущие данные демо-данными?', () => { S = seed(); save(); render(); }, 'Заменить');
  $('#wipe').onclick = () => confirmBox('Удалить все сделки, контакты, компании и задачи? Воронки и пользователи останутся.', () => { S.leads=[]; S.contacts=[]; S.companies=[]; S.tasks=[]; save(); render(); toast('Данные очищены'); }, 'Очистить');
}

async function boot(){
  main.innerHTML = '<div class="empty">Загрузка…</div>';
  let raw = null;
  try{ raw = await IDB.get(LS); }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(LS); }catch(e){} if(raw === 'IDB') raw = null; }
  S = load(raw);
  if(!S.reg1) importRegistry(S);
  try{ const u = JSON.parse(localStorage.getItem(LS+'_ui')||'{}'); if(u.pipelineId) ui.pipelineId = u.pipelineId; }catch(e){}
  save(); render();
  if(!S.gs1) syncSheets(true);
  else if(!S.px1){ const st = buildPulseLeads(); const pp = productPipe('pulse'); ui.pipelineId = pp.id; saveUi(); render(); pulseReport(st); }
}
boot();
</script>
