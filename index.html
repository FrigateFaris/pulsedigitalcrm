<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>
/* тема применяется до отрисовки, чтобы не мигало */
(function(){ try{ var u=JSON.parse(localStorage.getItem('pulse_crm_v1_ui')||'{}'); var t=u.theme||'dark';
  var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', d?'dark':'light'); }catch(e){} })();
</script>
<style>
:root{
  --nav:#1b2836;--nav-h:#26384a;--nav-a:#34495e;--nav-t:#9aa6b2;
  --blue:#4c8bf7;--blue-d:#3a77e3;--link:#1375ab;
  --text:#313942;--text2:#2b3640;--muted:#92989b;--muted2:#6c757d;--dim:#b4bbc0;
  --bg:#f5f5f5;--board:#f7f8f9;--panel:#fff;--card:#fff;--card-b:#e2e5e7;--card-bh:#b8c2ca;
  --line:#e4e6e8;--line2:#eef0f1;--col-line:#e7e9eb;--input-b:#d6dadd;--input-bh:#cfd4d8;
  --hover:#f2f4f5;--rowh:#f8fafc;--feed:#eef1f3;--feedday:#dfe4e8;--feeddayt:#69737b;--note:#fff;
  --tag:#e8eef7;--tagt:#4a6382;--sel:#eef3fb;--sel-b:#d4e0f5;--btn:#fff;--btn-b:#c9ced2;--btn-bh:#a9b0b6;
  --soft:#f7f8f9;--qa-b:#c5cbcf;--menu-h:#f1f5fb;
  --head1:#1f5d9a;--head2:#174a7e;--lead-body:#fff;--ov:rgba(20,30,40,.55);--shadow:rgba(0,0,0,.06);
  --green:#7dc531;--red:#f25b5b;--orange:#f5a623;
  color-scheme:light;
}
html[data-theme="dark"]{
  --nav:linear-gradient(180deg,#1a3247,#132a3e 40%,#10263a);--nav-h:rgba(255,255,255,.06);--nav-a:transparent;--nav-t:#c3cfdb;
  --blue:#3d8bfd;--blue-d:#2f78e6;--link:#3d9bff;
  --text:#dbe4ec;--text2:#ffffff;--muted:#8ea2b6;--muted2:#a9b9c9;--dim:#5d7287;
  --bg:#0f2234;--board:#0f2234;--panel:#122a3f;--card:#16304a;--card-b:#2a4662;--card-bh:#41658a;
  --line:#22405b;--line2:#1b3650;--col-line:transparent;--input-b:#2c4864;--input-bh:#3f6181;
  --hover:#1a3651;--rowh:#163049;--feed:#0f2234;--feedday:transparent;--feeddayt:#a9b9c9;--note:#122a3f;
  --tag:#1d3a58;--tagt:#9cc3ec;--sel:#173a5e;--sel-b:#285488;--btn:#122a3f;--btn-b:#2c4864;--btn-bh:#4a7095;
  --soft:#16304a;--qa-b:#3b5978;--menu-h:#1d3c5b;
  --head1:#0f2234;--head2:#0f2234;--lead-body:#18324c;--ov:rgba(3,10,18,.65);--shadow:rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'PT Sans',Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;overflow:hidden}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
input,select,textarea,button{font:inherit;color:inherit}
select option{background:var(--panel);color:var(--text)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[data-theme="dark"] ::-webkit-scrollbar{width:10px;height:10px}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a424b;border-radius:6px;border:2px solid var(--board)}
html[data-theme="dark"] ::-webkit-scrollbar-track{background:var(--board)}
.dim{color:var(--dim)}

/* ---------- left nav ---------- */
#side{width:72px;flex:none;background:var(--nav);display:flex;flex-direction:column;z-index:40}
.nav-logo{height:64px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo span{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4c8bf7,#2bc3a5);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px 9px;color:var(--nav-t);font-size:10.5px;cursor:pointer;position:relative;text-align:center;line-height:1.1;user-select:none}
.nav-item:hover{background:var(--nav-h);color:#fff;text-decoration:none}
.nav-item.active{background:var(--nav-a);color:#fff}
.nav-item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.nav-item svg.i{width:23px;height:23px}
.nav-badge{position:absolute;top:6px;right:12px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}
.nav-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.06)}

/* ---------- main / topbar ---------- */
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}
.topbar{height:64px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:relative;z-index:5}
.top-title{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.dd{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 4px;border-radius:3px;white-space:nowrap}
.dd:hover{background:var(--hover)}
.caret{width:0;height:0;border:4px solid transparent;border-top:5px solid var(--muted);margin-top:4px}
.search{flex:1;max-width:560px;min-width:200px;height:36px;border:1px solid var(--input-b);border-radius:3px;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;color:var(--muted)}
.search:focus-within{border-color:var(--blue)}
.search input{flex:1;border:0;outline:0;min-width:0;height:100%;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search .preset{max-width:150px;flex:none;border:0;border-left:1px solid var(--line);background:var(--soft);height:28px;border-radius:2px;padding:0 6px;font-size:12.5px;color:var(--muted2);cursor:pointer;outline:0}
.top-count{color:var(--muted);font-size:13px;white-space:nowrap}
.sp{flex:1}
.btn{height:36px;padding:0 16px;border-radius:3px;border:1px solid var(--btn-b);background:var(--btn);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text)}
.btn:hover{border-color:var(--btn-bh)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-sm{height:30px;padding:0 12px;font-size:11.5px}
.btn-ic{width:36px;padding:0}
.btn-del{margin-left:auto;color:var(--red)}
.vt{display:flex;border:1px solid var(--input-b);border-radius:3px;overflow:hidden}
.vt button{width:34px;height:34px;border:0;background:var(--panel);cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.vt button+button{border-left:1px solid var(--line)}
.vt button.on{background:var(--sel);color:var(--blue)}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;text-decoration:none}
.tabs a.on{color:var(--text);border-color:var(--blue)}

/* ---------- kanban ---------- */
.board{flex:1;overflow:auto;display:flex;background:var(--board)}
.col{width:272px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--col-line);min-height:100%}
.col-head{position:sticky;top:0;z-index:3;background:var(--panel);text-align:center;padding:13px 10px 9px;border-bottom:3px solid var(--c)}
.col-name{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-sum{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.col-body{flex:1;padding:8px 8px 90px;transition:background .15s}
.col.over .col-body{background:rgba(76,139,247,.08)}
.quick-add{border:1px dashed var(--qa-b);border-radius:3px;padding:9px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:8px}
.quick-add:hover{border-color:var(--blue);color:var(--blue)}
.qa-form{background:var(--card);border:1px solid var(--sel-b);border-radius:3px;padding:8px;margin-bottom:8px;box-shadow:0 2px 6px var(--shadow)}
.qa-form input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 2px;outline:0;font-size:13px}
.qa-form input:focus{border-color:var(--blue)}
.qa-form input::placeholder{color:var(--muted)}
.qa-form .qa-l{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase}
.qa-btns{display:flex;gap:6px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:3px;padding:9px 11px;margin-bottom:6px;cursor:pointer;position:relative;box-shadow:0 1px 1px var(--shadow)}
.card:hover{border-color:var(--card-bh);box-shadow:0 2px 5px var(--shadow)}
.card.ghost{opacity:.35}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-name{font-weight:700;font-size:13.5px;word-break:break-word;color:var(--text2)}
.card-date{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:1px}
.card-contact{font-size:13px;color:var(--muted2);margin-top:3px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;min-height:16px}
.card-price{font-size:13px;color:var(--text2)}
.notask{font-size:11.5px;color:var(--orange)}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tdot.green{background:var(--green)}.tdot.red{background:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{background:var(--tag);color:var(--tagt);font-size:11px;padding:1px 7px;border-radius:2px}
.dropbar{position:absolute;left:0;right:0;bottom:-96px;height:86px;display:flex;transition:bottom .18s ease;z-index:30}
body.dragging .dropbar{bottom:0}
.dz{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;opacity:.93;border-top:3px solid rgba(255,255,255,.35)}
.dz.del{background:#7f8b97}.dz.lost{background:#a3adb6}.dz.won{background:#6cbf2a}
html[data-theme="dark"] .dz.del{background:#4f5963}html[data-theme="dark"] .dz.lost{background:#66707a}html[data-theme="dark"] .dz.won{background:#4f9a1c}
.dz.over{opacity:1;filter:brightness(1.15)}

/* ---------- tables ---------- */
.list-wrap{flex:1;overflow:auto;background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;font-weight:700;font-size:11.5px;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:var(--rowh)}
.tbl td.chk,.tbl th.chk{width:36px;padding-right:0}
.tbl .nm{font-weight:700;color:var(--link);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--sel);border-bottom:1px solid var(--sel-b);font-size:13px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---------- lead card ---------- */
.lead-wrap{flex:1;display:flex;min-height:0}
.lead-left{width:420px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.lead-head{background:linear-gradient(180deg,var(--head1),var(--head2));color:#fff;padding:14px 20px 16px}
.lh-top{display:flex;align-items:center;gap:10px;font-size:13px}
.lh-top a{color:#cfe0f3}
.lh-id{color:#9fbfdf}
.lh-more{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:26px;border-radius:3px;cursor:pointer;font-size:16px;line-height:1}
.lh-name{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:#fff;font-size:22px;font-weight:700;padding:6px 0 4px;outline:0;margin-top:4px}
.lh-name:hover,.lh-name:focus{border-color:rgba(255,255,255,.4)}
.tags-edit{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.tags-edit .tag{background:rgba(255,255,255,.18);color:#fff;display:inline-flex;gap:5px;align-items:center}
.tags-edit .tag b{cursor:pointer;font-weight:400;opacity:.7}
.tags-edit input{background:transparent;border:0;outline:0;color:#fff;font-size:12px;width:90px}
.tags-edit input::placeholder{color:#a9c4e2}
.stage-sel{margin-top:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:6px 10px;background:rgba(0,0,0,.18);border-radius:3px}
.stage-sel:hover{background:rgba(0,0,0,.28)}
.stage-sel .pn{color:#b9d0ea}
.stage-sel .caret{border-top-color:#cfe0f3}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}
.progress{display:flex;gap:3px;margin-top:10px}
.progress i{flex:1;height:5px;border-radius:1px}
.lead-tabs{display:flex;gap:18px;padding:0 20px;border-bottom:1px solid var(--line)}
.lead-tabs span{padding:12px 0 9px;font-weight:700;font-size:12.5px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.lead-tabs span.on{color:var(--text);border-color:var(--blue)}
.f-row{display:flex;align-items:center;padding:5px 20px;min-height:36px;font-size:13.5px}
.f-l{width:130px;flex:none;color:var(--muted)}
.f-v{flex:1;min-width:0}
.f-v input,.f-v select{width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;padding:5px 0;outline:0}
.f-v input:hover,.f-v select:hover{border-color:var(--input-bh)}
.f-v input:focus{border-color:var(--blue)}
.f-v input::placeholder{color:var(--dim)}
.sect{border-top:1px solid var(--line);padding:6px 0 10px}
.sect-h{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px;font-weight:700;font-size:12px;text-transform:uppercase;color:var(--muted)}
.sect-h a{font-weight:400;text-transform:none;font-size:12.5px}
.ent-name{font-weight:700;font-size:15px}
.add-link{display:block;padding:8px 20px;color:var(--link);cursor:pointer}
.lead-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.lead-feed{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--feed)}
.feed-list{flex:1;overflow:auto;padding:18px 26px}
.feed-day{text-align:center;margin:14px 0 10px}
.feed-day span{background:var(--feedday);color:var(--feeddayt);font-size:11.5px;padding:3px 10px;border-radius:10px;font-weight:700}
.ev{font-size:12.5px;color:var(--muted);margin:6px 0;display:flex;gap:8px}
.ev time{color:var(--dim);flex:none}
.note{background:var(--note);border-radius:3px;padding:10px 14px;margin:8px 0;box-shadow:0 1px 1px var(--shadow);position:relative}
.note-h{font-size:12px;color:var(--muted);margin-bottom:4px}
.note-t{white-space:pre-wrap;word-break:break-word}
.note .del{position:absolute;right:8px;top:6px;color:var(--dim);cursor:pointer;display:none}
.note:hover .del{display:block}
.tsk{background:var(--note);border-left:4px solid var(--green);border-radius:3px;padding:10px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;box-shadow:0 1px 1px var(--shadow)}
.tsk.over{border-color:var(--red)}
.tsk.done{border-color:var(--dim);opacity:.75}
.tsk.done .tsk-t{text-decoration:line-through}
.tsk-b{flex:1;min-width:0}
.tsk-h{font-size:12px;color:var(--muted)}
.tsk-h b{color:var(--text)}
.tsk.over .tsk-h b{color:var(--red)}
.rm{cursor:pointer;color:var(--dim)}
.rm:hover{color:var(--text)}
.composer{background:var(--panel);border-top:1px solid var(--line);padding:10px 26px 14px}
.comp-tabs{display:flex;gap:16px;margin-bottom:8px}
.comp-tabs span{font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--muted);cursor:pointer;padding-bottom:3px;border-bottom:2px solid transparent}
.comp-tabs span.on{color:var(--text);border-color:var(--blue)}
.composer textarea{width:100%;border:1px solid var(--input-b);background:var(--panel);border-radius:3px;padding:8px 10px;resize:vertical;min-height:58px;outline:0}
.composer textarea:focus,.composer input:focus,.composer select:focus{border-color:var(--blue)}
.composer textarea::placeholder,.composer input::placeholder{color:var(--muted)}
.comp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.composer input,.composer select{height:32px;border:1px solid var(--input-b);border-radius:3px;padding:0 8px;outline:0;background:var(--panel)}

/* ---------- tasks board ---------- */
.tcard{background:var(--card);border:1px solid var(--card-b);border-left:4px solid var(--green);border-radius:3px;padding:9px 11px;margin-bottom:6px;display:flex;gap:10px}
.tcard.over{border-left-color:var(--red)}
.tcard.done{border-left-color:var(--dim);opacity:.7}
.tcard.done .tc-t{text-decoration:line-through}
.tc-h{font-size:12px;color:var(--muted)}
.tc-t{margin:3px 0;word-break:break-word}
.tc-l{font-size:12.5px}
.ck{width:18px;height:18px;border:2px solid var(--qa-b);border-radius:50%;flex:none;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ck:hover{border-color:var(--green)}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.col-empty{text-align:center;color:var(--dim);font-size:13px;padding:14px}

/* ---------- dashboard ---------- */
.dash{flex:1;overflow:auto;padding:22px;background:radial-gradient(1200px 600px at 80% -10%,#3d6f8e 0,transparent 60%),linear-gradient(135deg,#0f2133,#1d3a52 55%,#28536a);color:#fff}
html[data-theme="dark"] .dash{background:radial-gradient(1200px 600px at 80% -10%,#24435a 0,transparent 60%),linear-gradient(135deg,#0b1520,#14283a 55%,#1b3a4c)}
.dash-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dash-h h1{font-size:20px;margin:0;font-weight:700}
.dash-h select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:3px;height:32px;padding:0 8px}
.dash-h select option{color:#000;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.w{background:rgba(10,20,30,.42);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:16px 18px;backdrop-filter:blur(4px)}
.w-t{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#a9bccd;font-weight:700}
.w-v{font-size:34px;font-weight:700;margin-top:10px;line-height:1}
.w-s{font-size:13px;color:#b9c9d6;margin-top:6px}
.w-s a{color:#9cc6ff}
.w.wide{grid-column:span 2}
.bars .b{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.bars .bn{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d5e1ea}
.bars .bt{flex:1;height:16px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bars .bt i{display:block;height:100%}
.bars .bv{width:110px;text-align:right;color:#b9c9d6;white-space:nowrap}
.ev-d{font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#d5e1ea}
.ev-d a{color:#9cc6ff}
.ev-d time{color:#8ea3b5;font-size:12px;margin-right:6px}

/* analytics / settings */
.page{flex:1;overflow:auto;padding:22px 26px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.funnel .fs{display:flex;align-items:center;gap:12px;margin:7px 0}
.funnel .fb{height:30px;border-radius:2px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:700;min-width:40px;color:#2b3640}
.funnel .fl{width:200px;flex:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.kpi{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.kpi .w-t{color:var(--muted)}
.kpi .w-v{font-size:26px;color:var(--text)}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border:0}
.set-row input,.set-row select{height:32px;border:1px solid var(--input-b);border-radius:3px;padding:0 8px;outline:0;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--input-b);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:0 14px;height:32px;cursor:pointer;font-size:13px;color:var(--muted2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff}

/* ---------- modal / menu ---------- */
.ov{position:fixed;inset:0;background:var(--ov);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.mdl{background:var(--panel);border-radius:3px;width:480px;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mdl.wide{width:640px}
.mdl-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
.mdl-h .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.mdl-b{padding:16px 22px}
.mdl-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.fm{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fm label{font-size:12px;color:var(--muted)}
.fm input,.fm select,.fm textarea{height:36px;border:1px solid var(--input-b);border-radius:3px;padding:0 10px;outline:0;background:var(--panel);width:100%}
.fm textarea{height:auto;min-height:70px;padding:8px 10px}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--blue)}
.fm2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mdl-sub{font-weight:700;font-size:12px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.rel{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}
.stg{display:flex;align-items:center;gap:8px;padding:5px 0}
.stg input{flex:1;height:32px;border:1px solid var(--input-b);border-radius:3px;padding:0 8px;outline:0;background:var(--panel)}
.stg .swb{width:28px;height:28px;border-radius:3px;border:1px solid rgba(0,0,0,.12);cursor:pointer;flex:none}
.stg .swf{width:28px;height:28px;border-radius:3px;flex:none}
.stg .mv{display:flex;flex-direction:column}
.stg .mv b,.stg .rm{cursor:pointer;color:var(--muted);font-size:11px;line-height:1;padding:1px 4px;user-select:none}
.stg .rm{font-size:18px}
.stg .mv b:hover,.stg .rm:hover{color:var(--text)}
.stg .lc{font-size:12px;color:var(--muted);width:66px;text-align:right}
.stg.fixed{color:var(--muted);font-size:13px;padding-left:22px}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:200;min-width:200px;max-height:70vh;overflow:auto;padding:4px 0}
.menu-i{padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13.5px}
.menu-i:hover{background:var(--menu-h)}
.menu-i.on{font-weight:700}
.menu-g{padding:8px 14px 4px;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pal{display:grid;grid-template-columns:repeat(6,26px);gap:6px;padding:10px}
.pal i{width:26px;height:26px;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.1)}
.pal i:hover{transform:scale(1.1)}
.toast{position:fixed;right:20px;bottom:20px;background:#2b3640;color:#fff;padding:11px 16px;border-radius:3px;z-index:300;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
html[data-theme="dark"] .toast{background:#3a434c}

/* ---------- детали amo (обе темы) ---------- */
.lpr{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px;margin-left:6px;white-space:nowrap}
.lpr.ok{background:#dff5d0;color:#2f7d0f}.lpr.unk{background:#fff1c7;color:#8a6200}.lpr.none{background:#e9ecef;color:#6c757d}

.tag.hot{background:#ffe1d2;color:#b4430f}.tag.ai{background:#e6defc;color:#5b3fc4}

.f-row.top{align-items:flex-start}.f-row.top .f-l{padding-top:6px}

.nav-acc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;color:var(--nav-t);font-size:10.5px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent)}

.top-count .n{color:var(--text2)}
.tb-sep{align-self:stretch;width:1px;background:var(--line)}
.lh-top{gap:8px}
.lh-back{font-size:24px;line-height:1;color:#cfe0f3!important;text-decoration:none!important}
.lh-top .lh-name{flex:1;margin:0;font-size:24px;padding:2px 0}

.lh2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}

.stage-line{margin-top:20px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}

.pbar{height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:9px;overflow:hidden}

.ltabs{display:flex;gap:20px;margin-top:22px;font-size:15px;font-weight:700}
.ltabs span{color:rgba(255,255,255,.5);cursor:pointer}.ltabs span.on{color:#fff}
.lbody{padding:14px 0 10px}
.lbody .f-row,.ent .f-row{min-height:37px;font-size:15px}
.ent{padding:12px 20px 8px;border-top:1px solid var(--line)}
.ent .f-row{padding-left:0;padding-right:0}
.ent-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ent-ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2f6b98,#8cc4e6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ent-ava.sq{border-radius:6px;background:linear-gradient(135deg,#55607a,#9aa7c0)}
.ent-h .ent-name{color:var(--text2);font-size:16px;cursor:pointer}
.ent-dots{cursor:pointer;color:var(--text2);font-weight:700;letter-spacing:1px;padding:0 4px}
.add-row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:16px}
.add-row:hover{color:var(--text)}
.add-row .pl{width:42px;height:42px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;line-height:1}
.lead-left>.add-row:last-of-type{border-bottom:1px solid var(--line)}
.feed-top{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 0 0 22px;border-bottom:1px solid var(--line);color:var(--muted);background:var(--feed)}
.feed-top input{flex:1;border:0;background:transparent;outline:0;color:var(--text);font-size:15px;height:100%}
.feed-top input::placeholder{color:var(--muted)}
.ev{font-size:13.5px;padding-left:64px}
.note,.tsk{margin-left:64px}
.note{position:relative}
.note:before{content:"";position:absolute;left:-48px;top:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--muted);box-sizing:border-box}
.warnbar{display:inline-flex;gap:8px;align-items:center;margin:0 0 8px;background:#fff4c9;color:#4d3d00;border:1px solid #f0d77a;border-radius:3px;padding:5px 12px;font-size:13.5px}
.warnbar a{color:#4d3d00;text-decoration:underline;cursor:pointer}
.cbox{border:1px solid var(--input-b);border-radius:3px;padding:10px 14px;background:var(--panel)}
.cbox .comp-tabs span{text-transform:none;font-weight:400;font-size:14.5px;color:var(--link);text-decoration:underline;border:0}
.cbox .comp-tabs span.on{color:var(--text2);text-decoration:none}
.cbox textarea{border:0!important;padding:4px 0;min-height:46px;background:transparent!important}
/* рабочий стол */
.adash{flex:1;overflow:auto;padding:22px 40px 40px;background:radial-gradient(1100px 420px at 50% -60px,#45b2e0 0,transparent 70%),linear-gradient(180deg,#2389c4 0%,#1673b1 40%,#0d5a92 100%);color:#fff}
.ad-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ad-logo{font-family:'Segoe Script','Brush Script MT',cursive;font-size:28px;font-weight:700;padding:4px 0 0 120px;letter-spacing:.3px}
.ad-ev{background:#11263a;border-radius:6px;padding:11px 22px;font-weight:700;font-size:13px;text-transform:uppercase;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#fff;text-decoration:none!important}
.ad-title{text-align:center;font-size:42px;font-weight:700;margin:6px 0 34px}
.ad-bar{display:flex;justify-content:center;gap:14px;margin-bottom:24px;position:relative;flex-wrap:wrap}
.pills{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:22px;overflow:hidden}

.pills button.on{background:rgba(255,255,255,.15);font-weight:700}
.ad-cfg{position:absolute;right:0;top:0;border:1px solid rgba(255,255,255,.4);border-radius:22px;background:transparent;color:#fff;padding:9px 22px;font-size:15.5px;cursor:pointer;text-decoration:none!important}
.ad-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;grid-auto-rows:242px;max-width:1520px;margin:0 auto}
.aw{background:#11283d;border-radius:6px;padding:16px 17px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.aw.w2{grid-column:span 2}.aw.h2{grid-row:span 2}.aw.w4{grid-column:span 4}
.aw-t{font-weight:700;font-size:13.5px;text-transform:uppercase}
.aw-v{font-size:52px;line-height:1;margin-top:10px;color:#8e7dff}
.aw-v.g{color:#22d36b}
.aw-s{font-size:14px;margin-top:4px;font-weight:700}
.aw-hr{width:116px;border-top:1px solid rgba(255,255,255,.8);margin:auto 0}
.aw-f{font-size:14px;color:#dbe6ef}
.aw-warn{color:#ffd23e;font-weight:700;font-size:13.5px;margin-top:14px}
.mg{margin-top:12px;font-size:15px}
.mg .bar{height:4px;background:#ffd23e;border-radius:2px;margin:6px 0 14px}

html[data-theme="dark"] .f-v,html[data-theme="dark"] .f-v input,html[data-theme="dark"] .f-v select{color:#fff}
html[data-theme="dark"] .list-wrap,html[data-theme="dark"] .tbl th{background:var(--bg)}

@media (max-width:1100px){.ad-cfg{position:static}.ad-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.aw.w2,.aw.w4{grid-column:span 2}.ad-logo{padding-left:0}}

  #side{width:56px}.nav-item{font-size:0}.nav-item svg.i{width:22px;height:22px}
  .top-count,.topbar .vt{display:none}
  .lead-wrap{flex-direction:column;overflow:auto}.lead-left{width:100%;overflow:visible}.lead-feed{min-height:520px}
  .w.wide{grid-column:auto}
  .btn-blue .lbl{display:none}
}

let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
function popup(anchor, el){
  closeMenu(); menuEl = el; el.classList.add('menu'); document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  let left = r.left, top = r.bottom + 4;
  const w = el.offsetWidth, h = el.offsetHeight;
  if(left + w > innerWidth - 8) left = Math.max(8, r.right - w);
  if(top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  if(r.right < 90){ left = r.right + 6; top = Math.min(r.top, innerHeight - h - 8); }
  el.style.left = left+'px'; el.style.top = top+'px';
  el.addEventListener('click', e => e.stopPropagation());
  setTimeout(() => document.addEventListener('click', closeMenu, {once:true}), 0);
}
function menu(anchor, items){
  const m = document.createElement('div');
  items.forEach(it => {
    if(it==='-'){ m.appendChild(document.createElement('hr')); return; }
    const d = document.createElement('div');
    if(it.group){ d.className='menu-g'; d.textContent=it.group; m.appendChild(d); return; }
    d.className = 'menu-i' + (it.on?' on':''); d.innerHTML = it.html || esc(it.label);
    d.onclick = () => { closeMenu(); it.onClick(); };
    m.appendChild(d);
  });
  popup(anchor, m);
}

}

const PRESETS = {active:'Открытые сделки', lpr_ok:'ЛПР подтверждён', lpr_unk:'ЛПР не подтверждён', lpr_none:'ЛПР нет', notcalled:'Не звонили', called:'Звонили', mine:'Мои сделки', notask:'Сделки без задач', overdue:'С просроченными задачами', won:'Успешно реализованные', lost:'Закрытые и нереализованные', all:'Все сделки'};
const LPRT = {ok:'Подтверждён', unk:'Не подтверждён', none:'Нет ЛПР'};
const LPRB = {ok:'ЛПР ✓', unk:'ЛПР ?', none:'Нет ЛПР'};
const isCalled = l => !!l.call && !/^не звонили$/i.test(l.call);
function presetOk(l){
  const now = Date.now();
  switch(ui.preset){
    case 'lpr_ok': return l.status==='active' && l.lpr==='ok';
    case 'lpr_unk': return l.status==='active' && l.lpr==='unk';
    case 'lpr_none': return l.status==='active' && (l.lpr||'none')==='none';
    case 'notcalled': return l.status==='active' && !isCalled(l);
    case 'called': return isCalled(l);
    case 'active': return l.status==='active';
    case 'mine': return l.status==='active' && l.responsible===S.me;
    case 'notask': return l.status==='active' && !openTasks(l).length;
    case 'overdue': return l.status==='active' && openTasks(l).some(t=>t.due<now);
    case 'won': return l.status==='won';
    case 'lost': return l.status==='lost';
    default: return true;
  }
}
function leadMatch(l, q){
  if(!q) return true;
  const c = contactOf(l), co = companyOf(l);
  return [l.name, '#'+l.num, c&&c.name, c&&c.phone, c&&c.email, co&&co.name, (l.tags||[]).join(' '), l.price, (l.fields||[]).map(f=>f[1]).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());
}
const filteredLeads = p => S.leads.filter(l => l.pipelineId===p.id && presetOk(l) && leadMatch(l, ui.q));

  $('#pipeDD').onclick = e => menu(e.currentTarget, [

function cardHtml(l){
  const c = contactOf(l), co = companyOf(l), ts = openTasks(l), now = Date.now();
  const task = ts.length ? (ts.some(t=>t.due<now) ? '<span class="tdot red" title="Есть просроченная задача"></span>' : '<span class="tdot green" title="Задача запланирована"></span>') : '<span class="notask">Нет задач</span>';
  const who = [co && co.name !== l.name ? co.name : '', c&&c.name].filter(Boolean).join(', ');
  return `<div class="card" draggable="true" data-id="${l.id}">
    <div class="card-top"><span class="card-who">${who?esc(who):'<span class="dim">Без контакта</span>'}</span><span class="card-date">${fdate(l.updatedAt||l.createdAt)}</span></div>
    <a class="card-link" href="#lead/${l.id}">${esc(l.name)}</a>
    ${(l.tags||[]).length?`<div class="tags">${l.tags.map(t=>`<span class="tag ${t.startsWith('🔥')||t==='Приоритет A'?'hot':t==='Под AI-агента'?'ai':''}">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="card-bottom"><span class="lp"><i class="gd"></i>${l.price?money(l.price):''}<span class="lpr ${l.lpr||'none'}" title="ЛПР: ${LPRT[l.lpr||'none']} · Звонок: ${esc(l.call||'—')}">${LPRB[l.lpr||'none']}</span>${isCalled(l)?'<span class="called" title="'+esc(l.call)+'">☎</span>':''}</span>${l.status==='active'?task:''}</div>
  </div>`;
}
function kanbanHtml(p, leads){
  const cols = p.stages.map(s => ({...s, items:leads.filter(l=>l.status==='active' && l.stageId===s.id)}));
  const orphan = leads.filter(l => l.status==='active' && !p.stages.some(s=>s.id===l.stageId));
  if(orphan.length && cols[0]) cols[0].items.push(...orphan);
  if(['won','all'].includes(ui.preset)) cols.push({...WON, items:leads.filter(l=>l.status==='won')});
  if(['lost','all'].includes(ui.preset)) cols.push({...LOST, items:leads.filter(l=>l.status==='lost')});
  return `<div class="board" id="board">${cols.map((c,i) => `
    <div class="col" data-stage="${c.id}">
      <div class="col-head" style="--c:${c.color}"><div class="col-name" title="${esc(c.name)}">${esc(c.name)}</div><div class="col-sum">${nLeads(c.items.length)}: ${money(sum(c.items))}</div></div>
      <div class="col-body">${i===0 && c.id!=='won' && c.id!=='lost' ? '<div class="quick-add" id="qa">Быстрое добавление</div>' : ''}${(() => { const lim = (ui.lim = ui.lim || {})[c.id] || 50; const s = c.items.sort((a,b)=>(a.sort||0)-(b.sort||0) || b.createdAt-a.createdAt);
        return s.slice(0, lim).map(cardHtml).join('') + (s.length > lim ? `<div class="quick-add" data-more="${c.id}">Показать ещё ${Math.min(50, s.length-lim)} из ${s.length-lim}</div>` : ''); })()}</div>
    </div>`).join('')}</div>`;
}
let dragId = null;
function endDrag(){ document.body.classList.remove('dragging'); $$('.over').forEach(x=>x.classList.remove('over')); }
function bindKanban(p){
  $$('.card').forEach(el => {
    el.onclick = () => location.hash = 'lead/' + el.dataset.id;
    el.ondragstart = e => { dragId = el.dataset.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragId); setTimeout(()=>{ el.classList.add('ghost'); document.body.classList.add('dragging'); }, 0); };
    el.ondragend = () => { el.classList.remove('ghost'); endDrag(); };
  });
  $$('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); if(!col.classList.contains('over')){ $$('.col.over').forEach(x=>x.classList.remove('over')); col.classList.add('over'); } };
    col.ondragleave = e => { if(!col.contains(e.relatedTarget)) col.classList.remove('over'); };
    col.ondrop = e => {
      e.preventDefault(); endDrag();
      const l = byId(S.leads, dragId); if(!l) return;
      const cards = $$('.card', col).filter(c => c.dataset.id !== l.id);
      let idx = cards.findIndex(c => { const r=c.getBoundingClientRect(); return e.clientY < r.top + r.height/2; });
      if(idx < 0) idx = cards.length;
      moveLead(l, col.dataset.stage);
      const ids = cards.map(c => c.dataset.id); ids.splice(idx, 0, l.id);
      ids.forEach((id,i) => { const x = byId(S.leads,id); if(x) x.sort = i; });
      save(); renderLeads();
    };
  });
  $$('.dz').forEach(dz => {
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => {
      e.preventDefault(); endDrag();
      const l = byId(S.leads, dragId); if(!l) return;
      if(dz.dataset.act==='del') confirmBox(`Удалить сделку «${l.name}»? Её задачи тоже удалятся.`, () => { deleteLeads([l.id]); renderLeads(); });
      else { moveLead(l, dz.dataset.act); save(); renderLeads(); toast(dz.dataset.act==='won' ? 'Сделка успешно реализована 🎉' : 'Сделка закрыта'); }
    };
  });
  $$('[data-more]').forEach(b => b.onclick = () => { ui.lim[b.dataset.more] = (ui.lim[b.dataset.more]||50) + 50; const sc = $('#board').scrollLeft; renderLeads(); $('#board').scrollLeft = sc; });
  const qa = $('#qa'); if(qa) qa.onclick = () => quickAdd(qa, p);
}
function quickAdd(el, p){
  const f = document.createElement('div'); f.className='qa-form';
  f.innerHTML = `<input name="name" placeholder="Название сделки"><input name="price" type="number" min="0" placeholder="Бюджет, ${esc(S.currency)}">
    <div class="qa-l">Контакт</div><input name="cname" placeholder="Имя"><input name="phone" placeholder="Телефон"><input name="email" placeholder="Email">
    <div class="qa-l">Компания</div><input name="coname" placeholder="Название компании">
    <div class="qa-btns"><button class="btn btn-blue btn-sm" data-a>Добавить</button><button class="btn btn-sm" data-c>Отмена</button></div>`;
  el.replaceWith(f); $('input',f).focus();
  const v = n => $(`[name=${n}]`,f).value.trim();
  const go = () => {
    createLead({name:v('name'), price:v('price'), pipelineId:p.id, stageId:p.stages[0].id, contact:{name:v('cname'), phone:v('phone'), email:v('email')}, company:{name:v('coname')}});
    renderLeads(); toast('Сделка добавлена');
  };
  $('[data-a]',f).onclick = go;
  $('[data-c]',f).onclick = () => renderLeads();
  f.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
}
function createLead(d){
  const now = Date.now();
  let contactId = d.contactId || null, companyId = d.companyId || null;
  if(!companyId && d.company && d.company.name){ const co = {id:uid(), name:d.company.name, phone:'', web:'', address:'', createdAt:now}; S.companies.push(co); companyId = co.id; }
  if(!contactId && d.contact && (d.contact.name || d.contact.phone || d.contact.email)){
    const c = {id:uid(), name:d.contact.name || d.contact.phone || d.contact.email, phone:d.contact.phone||'', email:d.contact.email||'', position:'', companyId, createdAt:now};
    S.contacts.push(c); contactId = c.id;
  }
  const colSort = S.leads.filter(l=>l.stageId===d.stageId).reduce((m,l)=>Math.min(m,l.sort||0),0) - 1;
  const l = {id:uid(), num:++S.seq, name:d.name || ('Сделка #'+(S.seq)), price:+d.price||0, pipelineId:d.pipelineId, stageId:d.stageId, status:'active',
    contactId, companyId, responsible:d.responsible||S.me, tags:d.tags||[], createdAt:now, updatedAt:now, sort:colSort, feed:[]};
  log(l, 'Сделка создана');
  S.leads.push(l); save(); return l;
}
function deleteLeads(ids){
  S.leads = S.leads.filter(l => !ids.includes(l.id));
  S.tasks = S.tasks.filter(t => !ids.includes(t.leadId));
  ids.forEach(id => ui.sel.delete(id)); save();
}

    <div id="nl-cnew" class="fm2"><div class="fm"><label>Имя</label><input id="nl-cname"></div><div class="fm"><label>Телефон</label><input id="nl-cphone"></div><div class="fm"><label>Email</label><input id="nl-cemail"></div></div>

    <div class="fm" id="nl-conew"><input id="nl-coname" placeholder="Название компании"></div></div>`,

      contactId:g('nl-c')||null, contact:{name:g('nl-cname'), phone:g('nl-cphone'), email:g('nl-cemail')},
      companyId:g('nl-co')||null, company:{name:g('nl-coname')}});
    renderLeads(); toast(`Сделка «${l.name}» создана`);
  }});
  $('#nl-c',m).onchange = e => $('#nl-cnew',m).style.display = e.target.value ? 'none' : '';
  $('#nl-co',m).onchange = e => $('#nl-conew',m).style.display = e.target.value ? 'none' : '';
}

function leadListHtml(p, leads){
  if(!leads.length) return `<div class="list-wrap"><div class="empty">Сделок не найдено</div></div>`;
  leads.sort((a,b)=>b.createdAt-a.createdAt);
  const allOn = leads.every(l=>ui.sel.has(l.id));
  const total = leads.length; ui.listLim = ui.listLim || 300; leads = leads.slice(0, ui.listLim);
  return `<div class="list-wrap">
    ${ui.sel.size?`<div class="bulk"><b>Выбрано: ${ui.sel.size}</b><button class="btn btn-sm" id="bStage">Сменить этап</button><button class="btn btn-sm" id="bLpr">ЛПР</button><button class="btn btn-sm" id="bCall">Звонок</button><button class="btn btn-sm" id="bResp">Ответственный</button><button class="btn btn-sm" id="bTag">Добавить тег</button><button class="btn btn-sm btn-red" id="bDel">Удалить</button><a href="javascript:void 0" id="bClr" style="margin-left:auto">Снять выделение</a></div>`:''}
    <table class="tbl"><thead><tr><th class="chk"><input type="checkbox" id="selAll" ${allOn?'checked':''}></th><th>Название</th><th>Основной контакт</th><th>Компания</th><th>ЛПР</th><th>Звонок</th><th>Этап</th><th>Бюджет</th><th>Ответственный</th><th>Задачи</th><th>Создана</th></tr></thead>
    <tbody>${leads.map(l => { const c=contactOf(l), co=companyOf(l), si=stageInfo(l), ts=openTasks(l);
      return `<tr data-id="${l.id}"><td class="chk"><input type="checkbox" class="sel" ${ui.sel.has(l.id)?'checked':''}></td>
      <td><span class="nm">${esc(l.name)}</span></td><td>${c?esc(c.name):DASH}</td><td>${co?esc(co.name):DASH}</td>
      <td><span class="lpr ${l.lpr||'none'}">${LPRT[l.lpr||'none']}</span></td><td>${isCalled(l)?esc(l.call):'<span class="dim">Не звонили</span>'}</td>
      <td><span class="chip"><i style="background:${si.color}"></i>${esc(si.name)}</span></td><td>${money(l.price)}</td><td>${esc(l.responsible)}</td>
      <td>${l.status!=='active'?'':ts.length?(ts.some(t=>t.due<Date.now())?'<span style="color:var(--red)">Просрочена</span>':fdate(Math.min(...ts.map(t=>t.due)))):'<span class="notask">Нет задач</span>'}</td>
      <td style="color:var(--muted)">${fdate(l.createdAt)}</td></tr>`; }).join('')}</tbody></table>
    ${total > leads.length ? `<div style="padding:14px;text-align:center"><button class="btn btn-sm" id="listMore">Показать ещё (${total - leads.length})</button></div>` : ''}</div>`;
}
function bindLeadList(p){
  $$('.tbl .nm').forEach(n => n.onclick = () => location.hash = 'lead/' + n.closest('tr').dataset.id);
  $$('.tbl .sel').forEach(c => c.onchange = () => { const id=c.closest('tr').dataset.id; c.checked?ui.sel.add(id):ui.sel.delete(id); renderLeads(); });
  const sa = $('#selAll'); if(sa) sa.onchange = () => { filteredLeads(p).forEach(l => sa.checked?ui.sel.add(l.id):ui.sel.delete(l.id)); renderLeads(); };
  const lm = $('#listMore'); if(lm) lm.onclick = () => { ui.listLim += 300; renderLeads(); };
  if(!ui.sel.size) return;
  const sel = () => [...ui.sel].map(id=>byId(S.leads,id)).filter(Boolean);
  $('#bLpr').onclick = e => menu(e.currentTarget, Object.entries(LPRT).map(([k,v]) => ({label:v, onClick:()=>{ sel().forEach(l=>{ if(l.lpr!==k){ log(l,`ЛПР: ${LPRT[l.lpr||'none']} → ${v}`); l.lpr=k; } }); save(); renderLeads(); }})));
  $('#bCall').onclick = e => menu(e.currentTarget, CALLS.map(v => ({label:v, onClick:()=>{ sel().forEach(l=>{ if(l.call!==v){ log(l,`Звонок: ${l.call||'—'} → ${v}`); l.call=v; } }); save(); renderLeads(); }})));
  $('#bClr').onclick = () => { ui.sel.clear(); renderLeads(); };
  $('#bDel').onclick = () => confirmBox(`Удалить ${nLeads(ui.sel.size)}?`, () => { deleteLeads([...ui.sel]); renderLeads(); });
  $('#bStage').onclick = e => menu(e.currentTarget, stageMenuItems(p.id, (pid, st) => { sel().forEach(l => moveLead(l, st, pid)); save(); renderLeads(); }));
  $('#bResp').onclick = e => menu(e.currentTarget, S.users.map(u => ({label:u, onClick:()=>{ sel().forEach(l=>{ if(l.responsible!==u){ log(l,`Ответственный: ${l.responsible} → ${u}`); l.responsible=u; } }); save(); renderLeads(); }})));
  $('#bTag').onclick = () => { modal('Добавить тег', `<div class="fm"><label>Тег</label><input id="tg"></div>`, {okText:'Добавить', onOk:m=>{ const t=$('#tg',m).value.trim(); if(!t) return false; sel().forEach(l=>{ l.tags=l.tags||[]; if(!l.tags.includes(t)) l.tags.push(t); }); save(); renderLeads(); }}); };
}
function stageMenuItems(curPid, cb){
  const items = [];
  S.pipelines.forEach(p => {
    items.push({group:p.name});
    p.stages.forEach(s => items.push({html:`<i class="sw" style="background:${s.color}"></i>${esc(s.name)}`, onClick:()=>cb(p.id, s.id)}));
  });
  items.push('-');
  items.push({html:`<i class="sw" style="background:${WON.color}"></i>${WON.name}`, onClick:()=>cb(curPid,'won')});
  items.push({html:`<i class="sw" style="background:${LOST.color}"></i>${LOST.name}`, onClick:()=>cb(curPid,'lost')});
  return items;
}
function exportCsv(p){
  const rows = [['ID','Название','Этап','Бюджет','Контакт','Телефон','Email','Компания','Ответственный','Теги','Создана']];
  S.leads.filter(l=>l.pipelineId===p.id).forEach(l => { const c=contactOf(l)||{}, co=companyOf(l)||{};
    rows.push([l.num,l.name,stageInfo(l).name,l.price,c.name||'',c.phone||'',c.email||'',co.name||'',l.responsible,(l.tags||[]).join(', '),new Date(l.createdAt).toLocaleString('ru-RU')]); });
  download(`сделки_${p.name}.csv`, '﻿' + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'), 'text/csv');
}
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ================= pipeline editor ================= */
function editPipeline(pid){
  const src = pid ? byId(S.pipelines,pid) : null;
  const w = src ? JSON.parse(JSON.stringify(src)) : {id:uid(), name:'Новая воронка', stages:['Первичный контакт','Переговоры','Принимают решение'].map((n,i)=>({id:uid(),name:n,color:COLORS[i]}))};
  const count = sid => S.leads.filter(l=>l.pipelineId===w.id && l.status==='active' && l.stageId===sid).length;
  const body = () => `
    <div class="fm"><label>Название воронки</label><input id="pp-name" value="${esc(w.name)}"></div>
    <div class="mdl-sub">Этапы</div>
    <div id="pp-st">${w.stages.map((s,i)=>`<div class="stg" data-i="${i}"><span class="mv"><b data-up>▲</b><b data-dn>▼</b></span><span class="swb" data-col style="background:${s.color}"></span><input value="${esc(s.name)}" data-nm><span class="lc">${count(s.id)?nLeads(count(s.id)):''}</span><span class="rm" data-rm title="Удалить этап">×</span></div>`).join('')}</div>
    <a href="javascript:void 0" id="pp-add" style="display:inline-block;margin:8px 0 6px 22px">+ Добавить этап</a>
    <div class="stg fixed"><span class="swf" style="background:${WON.color}"></span>${WON.name}</div>
    <div class="stg fixed"><span class="swf" style="background:${LOST.color}"></span>${LOST.name}</div>`;
  const m = modal(src ? 'Настройка воронки' : 'Новая воронка', body(), {wide:true, okText:'Сохранить',
    extra: src && S.pipelines.length>1 ? '<button class="btn btn-del" id="pp-del">Удалить воронку</button>' : '',
    onOk: () => {
      sync(); if(!w.name.trim()){ toast('Укажите название воронки'); return false; }
      if(!w.stages.length){ toast('Нужен хотя бы один этап'); return false; }
      w.stages.forEach((s,i)=>{ if(!s.name.trim()) s.name = 'Этап '+(i+1); });
      S.leads.forEach(l => { if(l.pipelineId===w.id && l.status==='active' && !w.stages.some(s=>s.id===l.stageId)){ log(l, `Этап удалён, сделка перенесена в «${w.stages[0].name}»`); l.stageId = w.stages[0].id; } });
      if(src) Object.assign(src, w); else S.pipelines.push(w);
      ui.pipelineId = w.id; saveUi(); save(); (location.hash==='#leads' || !location.hash) ? renderLeads() : (location.hash='leads');
    }});
  const sync = () => { w.name = $('#pp-name',m).value; $$('.stg[data-i]',m).forEach(r => w.stages[+r.dataset.i].name = $('[data-nm]',r).value); };
  const redraw = () => { $('.mdl-b',m).innerHTML = body(); bind(); };
  const bind = () => {
    $('#pp-add',m).onclick = () => { sync(); w.stages.push({id:uid(), name:'Новый этап', color:COLORS[w.stages.length % COLORS.length]}); redraw(); const ins=$$('[data-nm]',m); ins[ins.length-1].select(); };
    $$('.stg[data-i]',m).forEach(r => { const i = +r.dataset.i;
      $('[data-up]',r).onclick = () => { sync(); if(i>0){ [w.stages[i-1],w.stages[i]]=[w.stages[i],w.stages[i-1]]; redraw(); } };
      $('[data-dn]',r).onclick = () => { sync(); if(i<w.stages.length-1){ [w.stages[i+1],w.stages[i]]=[w.stages[i],w.stages[i+1]]; redraw(); } };
      $('[data-rm]',r).onclick = () => { sync(); if(w.stages.length===1) return toast('Нужен хотя бы один этап'); w.stages.splice(i,1); redraw(); };
      $('[data-col]',r).onclick = e => { e.stopPropagation(); sync(); palette(e.currentTarget, c => { w.stages[i].color = c; redraw(); }); };
    });
  };
  bind();
  const del = $('#pp-del',m);
  if(del) del.onclick = () => {
    const n = S.leads.filter(l=>l.pipelineId===w.id).length;
    confirmBox(`Удалить воронку «${src.name}»${n?` и ${nLeads(n)} в ней`:''}? Это действие нельзя отменить.`, () => {
      const ids = S.leads.filter(l=>l.pipelineId===w.id).map(l=>l.id); deleteLeads(ids);
      S.pipelines = S.pipelines.filter(x=>x.id!==w.id); ui.pipelineId = S.pipelines[0].id; saveUi(); save(); render();
    });
  };
}

/* ================= lead card ================= */
let composerTab = 'note';

    ${!c ? `<div class="add-row" id="cAdd"><span class="pl">+</span>Добавить контакт</div>` : ''}

           <div class="comp-row"><input id="tText" placeholder="Комментарий к задаче" style="flex:1;min-width:200px"><button class="btn btn-blue btn-sm" id="tSend">Поставить</button></div>`}

  const bindFeed = () => {
    $$('[data-done]').forEach(b => b.onclick = () => completeTask(b.dataset.done, () => renderLead(id)));
    $$('[data-ndel]').forEach(b => b.onclick = () => { l.feed = l.feed.filter(f => f.id!==b.dataset.ndel); save(); renderLead(id); });
    $$('[data-tdel]').forEach(b => b.onclick = () => { S.tasks = S.tasks.filter(t => t.id!==b.dataset.tdel); save(); renderLead(id); });

  const touch = (txt) => { if(txt) log(l, txt); else l.updatedAt = Date.now(); save(); };

  $('#lname').onchange = e => { const v=e.target.value.trim(); if(!v){ e.target.value=l.name; return; } const o=l.name; l.name=v; touch(`Название: «${o}» → «${v}»`); renderLead(id); };
  $('#lprice').onchange = e => { const o=l.price; l.price=+e.target.value||0; touch(`Бюджет: ${money(o)} → ${money(l.price)}`); renderLead(id); };
  $('#lresp').onchange = e => { const o=l.responsible; l.responsible=e.target.value; touch(`Ответственный: ${o} → ${l.responsible}`); renderLead(id); };
  $('#tagin').onkeydown = e => { if(e.key==='Enter'){ const t=e.target.value.trim(); if(t){ l.tags=l.tags||[]; if(!l.tags.includes(t)) l.tags.push(t); touch(); renderLead(id); setTimeout(()=>$('#tagin').focus()); } } };
  $$('[data-ti]').forEach(b => b.onclick = () => { l.tags.splice(+b.dataset.ti,1); touch(); renderLead(id); });
  $('#stageSel').onclick = e => menu(e.currentTarget, stageMenuItems(l.pipelineId, (pid, st) => { moveLead(l, st, pid); save(); renderLead(id); }));
  $('#lmore').onclick = e => menu(e.currentTarget, [
    {label:'Дублировать сделку', onClick:()=>{ const n = createLead({...l, name:l.name+' (копия)', tags:[...(l.tags||[])]}); location.hash='lead/'+n.id; }},
    {label:'Удалить сделку', onClick:()=>$('#lDel').click()},

  $('#llpr').onchange = e => { const o = l.lpr||'none'; l.lpr = e.target.value; touch(`ЛПР: ${LPRT[o]} → ${LPRT[l.lpr]}`); renderLead(id); };
  $('#lcall').onchange = e => { const o = l.call||'—', v = e.target.value.trim() || 'Не звонили'; if(v!==o){ l.call = v; touch(`Звонок: ${o} → ${v}`); renderLead(id); } };
  $$('[data-fi]').forEach(x => x.onchange = () => { const f = l.fields[+x.dataset.fi], o = f[1]; f[1] = x.value.trim(); if(o!==f[1]) touch(`Поле «${f[0]}» изменено`); });
  $$('[data-cf]').forEach(inp => inp.onchange = () => { c[inp.dataset.cf] = inp.value.trim(); save(); });
  $$('[data-cof]').forEach(inp => inp.onchange = () => { co[inp.dataset.cof] = inp.value.trim(); save(); });
  if(c){ $('#cOpen').onclick = () => editContact(c.id, () => renderLead(id));

  else $('#cAdd').onclick = () => pickEntity('contact', l, () => renderLead(id));
  if(co){ $('#coOpen').onclick = () => editCompany(co.id, () => renderLead(id));
    $('#coDots').onclick = e => menu(e.currentTarget, [{label:'Открыть карточку компании', onClick:()=>editCompany(co.id, () => renderLead(id))}, {label:'Отвязать от сделки', onClick:()=>{ l.companyId=null; touch(`Компания отвязана: ${co.name}`); renderLead(id); }}]); }
  else $('#coAdd').onclick = () => pickEntity('company', l, () => renderLead(id));
  if($('#lWon')) $('#lWon').onclick = () => { moveLead(l,'won'); save(); renderLead(id); toast('Сделка успешно реализована 🎉'); };
  if($('#lLost')) $('#lLost').onclick = () => { moveLead(l,'lost'); save(); renderLead(id); };
  if($('#lReopen')) $('#lReopen').onclick = () => { moveLead(l, (p.stages[0]||{}).id); save(); renderLead(id); };
  $('#lDel').onclick = () => confirmBox(`Удалить сделку «${l.name}»?`, () => { deleteLeads([l.id]); location.hash='leads'; });
  $$('.comp-tabs span').forEach(s => s.onclick = () => { composerTab = s.dataset.t; renderLead(id); });
  if(composerTab==='note'){
    const send = () => { const t=$('#noteText').value.trim(); if(!t) return; (l.feed=l.feed||[]).push({id:uid(), type:'note', text:t, at:Date.now(), author:S.me}); l.updatedAt=Date.now(); save(); renderLead(id); };
    $('#noteSend').onclick = send; $('#noteText').onkeydown = e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); };
  } else {
    const send = () => { const due = new Date($('#tDue').value).getTime(); if(!due) return toast('Укажите срок');
      S.tasks.push({id:uid(), leadId:l.id, type:$('#tType').value, text:$('#tText').value.trim(), due, done:false, responsible:$('#tResp').value, createdAt:Date.now()});
      l.updatedAt = Date.now(); save(); renderLead(id); toast('Задача поставлена'); };
    $('#tSend').onclick = send; $('#tText').onkeydown = e => { if(e.key==='Enter') send(); };
  }
  bindFeed();
}
function feedHtml(l, q){
  const now = Date.now();
  let items = [...(l.feed||[]).map(f=>({...f, sortAt:f.at})), ...S.tasks.filter(t=>t.leadId===l.id).map(t=>({...t, kind:'task', sortAt:t.done?(t.doneAt||t.createdAt):t.createdAt}))].sort((a,b)=>a.sortAt-b.sortAt);
  if(q) items = items.filter(it => [it.text, it.type, it.author, it.responsible, it.result].join(' ').toLowerCase().includes(q.toLowerCase()));
  let lastDay = null, out = '';
  items.forEach(it => {
    const d = fday(it.sortAt); if(d!==lastDay){ out += `<div class="feed-day"><span>${d}</span></div>`; lastDay = d; }
    if(it.kind==='task'){
      const over = !it.done && it.due < now;
      out += `<div class="tsk ${it.done?'done':''} ${over?'over':''}"><div class="tsk-b"><div class="tsk-h">Задача на <b>${fdate(it.due)}</b> для ${esc(it.responsible)} · ${esc(it.type)}</div><div class="tsk-t">${esc(it.text)||'<span class="dim">без комментария</span>'}</div>${it.done&&it.result?`<div class="tsk-h">Результат: ${esc(it.result)}</div>`:''}</div>
        ${it.done ? '<span style="color:var(--muted);font-size:12px">Выполнена</span>' : `<button class="btn btn-sm" data-done="${it.id}">Выполнить</button>`}<span class="rm" data-tdel="${it.id}" title="Удалить">×</span></div>`;
    } else if(it.type==='note'){
      out += `<div class="note"><div class="note-h">${tm(it.at)} · ${esc(it.author)} · Примечание</div><div class="note-t">${esc(it.text)}</div><span class="del" data-ndel="${it.id}" title="Удалить">×</span></div>`;
    } else {
      out += `<div class="ev"><time>${fday(it.at)} ${tm(it.at)}</time><span>${esc(it.author.split(' ')[0])} ${esc(it.text)}</span></div>`;
    }
  });
  return out || '<div class="empty">Событий пока нет</div>';
}
function completeTask(tid, after){
  const t = byId(S.tasks, tid); if(!t) return;
  modal('Завершить задачу', `<div class="fm"><label>Результат (необязательно)</label><textarea id="tres" placeholder="Например: созвонились, ждём ответ до пятницы"></textarea></div>`, {okText:'Выполнить', onOk:m=>{
    t.done = true; t.doneAt = Date.now(); t.result = $('#tres',m).value.trim();
    const l = byId(S.leads, t.leadId); if(l) log(l, `Задача «${t.type}» выполнена${t.result?': '+t.result:''}`);
    save(); after();
  }});
}
function pickEntity(kind, l, after){
  const isC = kind==='contact', list = isC ? S.contacts : S.companies;
  const m = modal(isC?'Добавить контакт':'Добавить компанию', `
    <div class="fm"><label>Выбрать из базы</label><select id="pe-sel"><option value="">— создать ${isC?'новый':'новую'} —</option>${list.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
    <div id="pe-new">${isC ? `<div class="fm"><label>Имя</label><input id="pe-name"></div><div class="fm2"><div class="fm"><label>Телефон</label><input id="pe-phone"></div><div class="fm"><label>Email</label><input id="pe-email"></div></div>`
      : `<div class="fm"><label>Название</label><input id="pe-name"></div><div class="fm2"><div class="fm"><label>Телефон</label><input id="pe-phone"></div><div class="fm"><label>Сайт</label><input id="pe-web"></div></div>`}</div>`,
  {okText:'Добавить', onOk:m => {
    let id = $('#pe-sel',m).value;
    if(!id){
      const name = $('#pe-name',m).value.trim(); if(!name){ toast('Укажите имя'); return false; }
      const x = isC ? {id:uid(), name, phone:$('#pe-phone',m).value.trim(), email:$('#pe-email',m).value.trim(), position:'', companyId:l.companyId||null, createdAt:Date.now()}
                    : {id:uid(), name, phone:$('#pe-phone',m).value.trim(), web:$('#pe-web',m).value.trim(), address:'', createdAt:Date.now()};
      list.push(x); id = x.id;
    }
    const x = byId(list,id);
    if(isC){ l.contactId = id; if(!l.companyId && x.companyId) l.companyId = x.companyId; } else l.companyId = id;
    log(l, `${isC?'Контакт':'Компания'} привязан${isC?'':'а'}: ${x.name}`); save(); after();
  }});
  $('#pe-sel',m).onchange = e => $('#pe-new',m).style.display = e.target.value ? 'none' : '';
}

/* ================= contacts & companies ================= */
function renderList(kind){
  const isC = kind==='contacts', list = isC ? S.contacts : S.companies;
  const q = ui.listQ.toLowerCase();
  const rows = list.filter(x => !q || Object.values(x).join(' ').toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt);
  const leadsOf = x => S.leads.filter(l => isC ? l.contactId===x.id : l.companyId===x.id);
  const selKey = 'list_'+kind; ui[selKey] = ui[selKey] || new Set(); const sel = ui[selKey];
  main.innerHTML = `
  <div class="topbar">
    <div class="tabs"><a href="#contacts" class="${isC?'on':''}">Контакты</a><a href="#companies" class="${!isC?'on':''}">Компании</a></div>

  if(sel.size){

}
function removeEntity(kind, id){
  if(kind==='contacts'){ S.contacts = S.contacts.filter(c=>c.id!==id); S.leads.forEach(l=>{ if(l.contactId===id) l.contactId=null; }); }
  else { S.companies = S.companies.filter(c=>c.id!==id); S.leads.forEach(l=>{ if(l.companyId===id) l.companyId=null; }); S.contacts.forEach(c=>{ if(c.companyId===id) c.companyId=null; }); }

/* ================= tasks ================= */
let showDone = false;
function renderTasks(){
  const now = Date.now();
  const open = S.tasks.filter(t=>!t.done).sort((a,b)=>a.due-b.due);
  const cols = [
    {name:'Просроченные задачи', color:'#ff8f92', items:open.filter(t=>t.due<now)},
    {name:'Задачи на сегодня', color:'#87f2c0', items:open.filter(t=>t.due>=now && dayDiff(t.due,now)===0)},
    {name:'Задачи на завтра', color:'#99ccff', items:open.filter(t=>t.due>=now && dayDiff(t.due,now)===1)},
    {name:'Позже', color:'#ccc8f9', items:open.filter(t=>t.due>=now && dayDiff(t.due,now)>1)},
  ];
  if(showDone) cols.push({name:'Выполненные', color:'#d5d8db', items:S.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,50)});

  <div class="topbar"><span class="top-title">Задачи</span><div class="top-count">${open.length} ${plural(open.length,['открытая задача','открытые задачи','открытых задач'])}</div>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted2);cursor:pointer"><input type="checkbox" id="sd" ${showDone?'checked':''}> показать выполненные</label>
    <div class="sp"></div><button class="btn btn-blue" id="addTask">${icon('plus')}<span class="lbl">Добавить задачу</span></button></div>
  <div class="board">${cols.map(c=>`<div class="col"><div class="col-head" style="--c:${c.color}"><div class="col-name">${c.name}</div><div class="col-sum">${c.items.length}</div></div>
    <div class="col-body">${c.items.map(t => { const l = byId(S.leads,t.leadId); const over = !t.done && t.due<now;
      return `<div class="tcard ${over?'over':''} ${t.done?'done':''}"><span class="ck ${t.done?'on':''}" data-ck="${t.id}" title="${t.done?'Выполнена':'Выполнить'}"></span><div style="min-width:0;flex:1">
        <div class="tc-h">${fdate(t.due)} · ${esc(t.responsible)}</div><div class="tc-t"><b>${esc(t.type)}</b>${t.text?': '+esc(t.text):''}</div>
        ${l?`<div class="tc-l"><a href="#lead/${l.id}">${esc(l.name)}</a></div>`:''}</div></div>`; }).join('') || '<div class="col-empty">Нет задач</div>'}</div></div>`).join('')}</div>`;

  $('#addTask').onclick = () => {
    const act = S.leads.filter(l=>l.status==='active');
    modal('Новая задача', `
      <div class="fm"><label>Сделка</label><select id="nt-lead"><option value="">— без сделки —</option>${act.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>
      <div class="fm2"><div class="fm"><label>Срок</label><input type="datetime-local" id="nt-due" value="${toLocalInput(Date.now()+36e5)}"></div><div class="fm"><label>Тип</label><select id="nt-type">${TASK_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div></div>
      <div class="fm"><label>Ответственный</label><select id="nt-resp">${userOpts(S.me)}</select></div>
      <div class="fm"><label>Комментарий</label><textarea id="nt-text"></textarea></div>`,
    {okText:'Поставить', noFocus:true, onOk:m => {
      const due = new Date($('#nt-due',m).value).getTime(); if(!due){ toast('Укажите срок'); return false; }

/* ================= dashboard ================= */
const PERIODS = {today:['Сегодня','за сегодня'], yesterday:['Вчера','за вчера'], week:['Неделя','за неделю'], month:['Месяц','за месяц']};
function periodRange(k){
  const d = new Date(); d.setHours(0,0,0,0); const t0 = d.getTime(), D = 864e5;
  if(k==='today') return [t0, t0+D];
  if(k==='yesterday') return [t0-D, t0];
  if(k==='month') return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), t0+D];
  const wd = (d.getDay()+6)%7; return [t0-wd*D, t0+D];
}
function renderDash(){
  ui.dper = ui.dper || 'week';
  const now = Date.now(), [from, to] = periodRange(ui.dper), pl = PERIODS[ui.dper][1];
  const mine = x => !ui.dmine || x === S.me;
  const inR = ts => ts >= from && ts < to;
  const tasks = S.tasks.filter(t => mine(t.responsible));
  const overdue = tasks.filter(t => !t.done && t.due < now);
  const doneP = tasks.filter(t => t.done && inR(t.doneAt||0));
  const todo = tasks.filter(t => !t.done && t.due >= now);
  const act = S.leads.filter(l => l.status==='active' && mine(l.responsible));
  const noTask = act.filter(l => !openTasks(l).length);
  const newP = S.leads.filter(l => mine(l.responsible) && inR(l.createdAt));
  const wonP = S.leads.filter(l => l.status==='won' && mine(l.responsible) && inR(l.closedAt||0));
  const stages = S.pipelines.flatMap(p => p.stages.map(s => ({...s, name:(S.pipelines.length>1?p.name+' · ':'')+s.name, n:act.filter(l=>l.stageId===s.id).length})));
  const maxN = Math.max(1, ...stages.map(s=>s.n));
  const byU = S.users.map(u => { const ls = act.filter(l=>l.responsible===u); return {u, n:ls.length, s:sum(ls)}; }).filter(x=>x.n);
  const maxU = Math.max(1, ...byU.map(x=>x.n));
  const events = S.leads.flatMap(l => (l.feed||[]).map(f=>({...f, l}))).sort((a,b)=>b.at-a.at).slice(0,9);
  main.innerHTML = `<div class="adash">
    <div class="ad-top"><div class="ad-logo">Pulse CRM.</div><a class="ad-ev" href="#tasks">☰ &nbsp;События</a></div>
    <div class="ad-title">${esc(S.account || 'pulsedigital')}</div>
    <div class="ad-bar">
      <div class="pills">${Object.entries(PERIODS).map(([k,v])=>`<button data-per="${k}" class="${ui.dper===k?'on':''}">${v[0]}</button>`).join('')}</div>
      <div class="pills"><button data-mine="0" class="${!ui.dmine?'on':''}">Все</button><button data-mine="1" class="${ui.dmine?'on':''}">Мои</button></div>
      <a class="ad-cfg" href="#settings">⚙ Настроить</a>
    </div>
    <div class="ad-grid">
      <div class="aw"><div class="aw-t">Просроченные задачи</div><div class="aw-v">${overdue.length}</div><div class="aw-hr"></div><div class="aw-f">все открытые</div></div>
      <div class="aw"><div class="aw-t">Выполненные задачи</div><div class="aw-v g">${doneP.length}</div><div class="aw-f" style="margin-top:6px">${pl}</div></div>
      <div class="aw w2 h2"><div class="aw-t">Сделки по этапам</div>${act.length ? stages.map(s=>`<div class="ab"><span class="bn" title="${esc(s.name)}">${esc(s.name)}</span><span class="bt"><i style="width:${s.n/maxN*100}%;background:${s.color}"></i></span><span class="bv">${s.n}</span></div>`).join('') : '<div class="aw-warn">⚠ Недостаточно данных для отображения</div>'}</div>
      <div class="aw w2 h2"><div class="aw-t">Сделки по менеджерам</div><div class="aw-v">${act.length}</div><div class="aw-hr" style="margin:14px 0 18px"></div>
        <div class="mg">${byU.map(x=>`<div>${esc(x.u.split(' ')[0])} <b>${nLeads(x.n)}</b> <small>(${money(x.s)})</small></div><div class="bar" style="width:${x.n/maxU*100}%"></div>`).join('') || '<div class="aw-warn">⚠ Недостаточно данных для отображения</div>'}</div></div>
      <div class="aw"><div class="aw-t">Задачи к выполнению</div><div class="aw-v">${todo.length}</div><div class="aw-hr"></div><div class="aw-f">все открытые</div></div>
      <div class="aw"><div class="aw-t">Сделок без задач</div><div class="aw-v">${noTask.length}</div><div class="aw-s">${money(sum(noTask))}</div><div class="aw-hr"></div><div class="aw-f">в работе сейчас</div></div>
      <div class="aw"><div class="aw-t">Новые сделки</div><div class="aw-v">${newP.length}</div><div class="aw-s">${money(sum(newP))}</div><div class="aw-hr"></div><div class="aw-f">${pl}</div></div>
      <div class="aw"><div class="aw-t">Успешные сделки</div><div class="aw-v g">${wonP.length}</div><div class="aw-s">${money(sum(wonP))}</div><div class="aw-hr"></div><div class="aw-f">${pl}</div></div>
      <div class="aw w4"><div class="aw-t">Последние события</div><div style="margin-top:6px;overflow:auto">${events.map(e=>`<div class="ev-d"><time>${fdate(e.at)}</time><a href="#lead/${e.l.id}">${esc(e.l.name)}</a> — ${esc(e.type==='note'?'примечание: '+e.text.slice(0,70):e.text)}</div>`).join('')||'<div class="aw-warn">⚠ Недостаточно данных для отображения</div>'}</div></div>
    </div></div>`;
  $$('[data-per]').forEach(b => b.onclick = () => { ui.dper = b.dataset.per; renderDash(); });
  $$('[data-mine]').forEach(b => b.onclick = () => { ui.dmine = b.dataset.mine==='1'; renderDash(); });
}

/* ================= analytics ================= */
function renderAnalytics(){
  const p = curPipe();
  const ls = S.leads.filter(l=>l.pipelineId===p.id);
  const won = ls.filter(l=>l.status==='won'), lost = ls.filter(l=>l.status==='lost'), act = ls.filter(l=>l.status==='active');
  const idxOf = l => l.status==='won' ? p.stages.length : p.stages.findIndex(s=>s.id===l.stageId);
  const reach = p.stages.map((s,i) => ({s, n: ls.filter(l=>l.status!=='lost' && idxOf(l)>=i).length}));
  const maxN = Math.max(1, ...reach.map(r=>r.n), won.length);
  const byUser = S.users.map(u => { const x = ls.filter(l=>l.responsible===u); const w = x.filter(l=>l.status==='won'), lo = x.filter(l=>l.status==='lost');
    return {u, act:x.filter(l=>l.status==='active'), w, lo, conv: w.length+lo.length ? Math.round(w.length/(w.length+lo.length)*100) : null}; });
  main.innerHTML = `
  <div class="topbar"><span class="top-title">Аналитика</span><div class="dd" id="apd"><span>${esc(p.name)}</span><span class="caret"></span></div></div>
  <div class="page">
    <div class="kpis">
      <div class="kpi"><div class="w-t">Всего сделок</div><div class="w-v">${ls.length}</div></div>
      <div class="kpi"><div class="w-t">В работе</div><div class="w-v">${money(sum(act))}</div></div>
      <div class="kpi"><div class="w-t">Выиграно</div><div class="w-v" style="color:var(--green)">${money(sum(won))}</div></div>
      <div class="kpi"><div class="w-t">Проиграно</div><div class="w-v" style="color:var(--muted)">${money(sum(lost))}</div></div>
    </div>
    <div class="panel"><h3>Воронка: сколько сделок дошли до этапа</h3><div class="funnel">
      ${reach.map(r=>`<div class="fs"><span class="fl" title="${esc(r.s.name)}">${esc(r.s.name)}</span><span class="fb" style="width:${Math.max(6,r.n/maxN*100)}%;background:${r.s.color}">${r.n}</span></div>`).join('')}
      <div class="fs"><span class="fl">${WON.name}</span><span class="fb" style="width:${Math.max(6,won.length/maxN*100)}%;background:${WON.color}">${won.length}</span></div>
      <div class="fs"><span class="fl">${LOST.name}</span><span class="fb" style="width:${Math.max(6,lost.length/maxN*100)}%;background:${LOST.color}">${lost.length}</span></div>
    </div></div>
    <div class="panel"><h3>По менеджерам</h3><table class="tbl"><thead><tr><th>Ответственный</th><th>В работе</th><th>Успешно</th><th>Не реализовано</th><th>Конверсия</th></tr></thead><tbody>
      ${byUser.map(r=>`<tr><td><b>${esc(r.u)}</b></td><td>${r.act.length} · ${money(sum(r.act))}</td><td>${r.w.length} · ${money(sum(r.w))}</td><td>${r.lo.length}</td><td>${r.conv===null?'—':r.conv+'%'}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
  $('#apd').onclick = e => menu(e.currentTarget, S.pipelines.map(x => ({label:x.name, on:x.id===p.id, onClick:()=>{ ui.pipelineId=x.id; saveUi(); renderAnalytics(); }})));
}
